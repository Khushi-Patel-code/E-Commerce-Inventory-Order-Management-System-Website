<!-- checkout.html -->
<form id="checkoutForm">
  <label>Shipping Address
    <input type="text" id="shippingAddress" required />
  </label>
  <label>Billing Address
    <input type="text" id="billingAddress" required />
  </label>
  <button type="submit">Confirm Order</button>
</form>

<script>
document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const shipping_address = document.getElementById('shippingAddress').value;
  const billing_address = document.getElementById('billingAddress').value;
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');

  const token = localStorage.getItem('token');
  if (!token) {
    alert('You must be logged in to place an order.');
    return;
  }

  try {
    const subtotal = cart.reduce((sum, i) => sum + (parseFloat(i.price) * (i.quantity || 1)), 0);
    const total = subtotal; // adjust if you add tax/shipping later

    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        shipping_address,
        billing_address,
        subtotal,
        tax: 0,
        shipping_fee: 0,
        total,
        order_status: 'pending',
        cart //include cart array
      })
    });

    const result = await res.json();

    if (result.success) {
      alert('Order placed successfully!');
      localStorage.removeItem('cart');
      // Redirect to the correct file
      window.location.href = 'customer-orders.html';
    } else {
      alert('Failed to place order: ' + (result.message || 'Unknown error'));
    }
  } catch (err) {
    console.error(err);
    alert('Failed to place order: ' + err.message);
  }
});
</script>
