<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
         body {
            background-color: #f8f9fc;
        }
        .sidebar {
            height: 100vh;
            width: 230px;
            background: #343a40;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 12px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content-area {
            margin-left: 230px;
            padding: 20px;
        }
        table th, table td {
            vertical-align: middle !important;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>

    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line me-2"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<!-- CONTENT AREA -->
<div class="content-area">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa fa-box"></i> Products</h2>

        <button class="btn btn-light" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-2x"></i>
        </button>
    </div>

    <!-- PAGE CONTENT -->
    <div class="card shadow-sm p-4">

        <button id="loadProducts" class="btn btn-primary mb-3">
            <i class="fa fa-sync"></i> Load Products
        </button>

        <div id="status" class="mb-2 text-muted"></div>

        <div class="table-responsive">
            <table id="productsTable" class="table table-striped table-bordered" style="display:none;">
                <thead id="productsHead"></thead>
                <tbody id="productsBody"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="../js/main.js"></script>

</body>
</html>
