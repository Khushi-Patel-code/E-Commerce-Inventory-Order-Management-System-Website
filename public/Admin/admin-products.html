<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fc; }
    .sidebar { height: 100vh; width: 210px; background: #343a40; padding-top: 20px; }
    .sidebar a { color: white; padding: 12px; display: block; text-decoration: none; }
    .sidebar a:hover { background: #495057; }
    .content-area { margin-left: 230px; padding: 20px; }
    table th, table td { vertical-align: middle !important; }
  </style>
</head>
<body>

<div class="sidebar position-fixed">
  <h4 class="text-center text-white">Admin Panel</h4>
  <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
  <a href="admin-products.html" style="background:#495057;"><i class="fa fa-box me-2"></i> Products</a>
  <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
  <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
  <a href="admin-views.html"><i class="fa fa-table me-2"></i> SQL Views</a>
  <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
  <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<div class="content-area">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa fa-box"></i> Products</h2>
    <button class="btn btn-light" onclick="window.location.href='admin-profile.html'">
      <i class="fa fa-user-circle fa-3x"></i>
    </button>
  </div>

  <div class="card shadow-sm p-4">
    <div class="d-flex mb-3">
      <input id="searchProductId" class="form-control me-2" placeholder="Search Product ID">
      <button class="btn btn-dark" onclick="searchProductById()"><i class="fa fa-search"></i></button>
    </div>

    <div class="mb-3">
      <button class="btn btn-primary me-2" onclick="loadProducts()">Load Recent Products</button>
      <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addProductModal">
        <i class="fa fa-plus"></i> Add Product
      </button>
      <button class="btn btn-info me-2" onclick="loadExternalProducts()">
        <i class="fa-solid fa-cloud-arrow-down"></i> Load External Products
      </button>
      <button class="btn btn-warning me-2" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-danger" onclick="exportPDF()">Export PDF</button>
    </div>

    <div id="status" class="text-muted mb-2"></div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead id="productsHead"></thead>
        <tbody id="productsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ADD PRODUCT MODAL -->
<div class="modal fade" id="addProductModal">
  <div class="modal-dialog">
    <form class="modal-content" onsubmit="submitAddProduct(event)">
      <div class="modal-header">
        <h5 class="modal-title">Add New Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label>SKU</label>
        <input class="form-control mb-2" name="sku" required>

        <label>Product Name</label>
        <input class="form-control mb-2" name="product_name" required>

        <label>Description</label>
        <textarea class="form-control mb-2" name="description"></textarea>

        <label>Category</label>
        <select class="form-control mb-2" name="category_id" id="categorySelect" required>
          <option value="">-- Select a Category --</option>
        </select>

        <label>Price</label>
        <input type="number" step="0.01" class="form-control mb-2" name="price" required>

        <label>Retail Price (Optional)</label>
        <input type="number" step="0.01" class="form-control mb-2" name="retail_price">

        <label>Initial Quantity</label>
        <input type="number" class="form-control mb-2" name="quantity" min="0" required>

        <label>Active</label>
        <select class="form-control mb-2" name="active" required>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary">Add Product</button>
      </div>
    </form>
  </div>
</div>


<!-- DELETE CONFIRM MODAL -->
<div class="modal fade" id="deleteConfirmModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Delete</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this product?</p>
        <input type="hidden" id="delete_product_id">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:3000/api/products";
const CATEGORY_API = "http://localhost:3000/api/categories";

/* ---------------------------
   1. LOAD RECENT PRODUCTS
-----------------------------*/
async function loadProducts() {
  document.getElementById("status").innerText = "Loading...";
  const res = await fetch(`${API_BASE}`);
  const json = await res.json();
  if (!json.success) return;

  const rows = json.data;
  let head = `
    <tr class="table-dark">
      <th>ID</th><th>SKU</th><th>Name</th><th>Price</th>
      <th>Active</th><th>Created At</th><th>Actions</th>
    </tr>`;
  let body = "";
  rows.forEach(p => {
    const displayPrice = p.price != null ? `$${Number(p.price).toFixed(2)}` : 'N/A';
    const displayCreatedAt = p.created_at ? new Date(p.created_at).toLocaleString() : 'N/A';
    body += `
      <tr>
        <td>${p.product_id}</td>
        <td>${p.sku}</td>
        <td>${p.product_name}</td>
        <td>${displayPrice}</td>
        <td>${p.active == 1 ? 'Yes' : 'No'}</td>
        <td>${displayCreatedAt}</td>
        <td>
          <button class="btn btn-sm btn-info me-1" onclick="viewProduct(${p.product_id})"><i class="fa fa-eye"></i></button>
          <button class="btn btn-sm btn-warning me-1" onclick='openUpdateModal(${JSON.stringify(p)})'><i class="fa fa-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.product_id})"><i class="fa fa-trash"></i></button>
        </td>
      </tr>`;
  });
  document.getElementById("productsHead").innerHTML = head;
  document.getElementById("productsBody").innerHTML = body;
  document.getElementById("status").innerText = `Showing ${rows.length} recent products.`;
}

/* ---------------------------
   2. LOAD CATEGORIES
-----------------------------*/
async function loadCategories() {
  try {
    const res = await fetch(CATEGORY_API);
    const json = await res.json();
    if (!json.success) return;
    const select = document.getElementById("categorySelect");
    select.innerHTML = '<option value="">-- Select a Category --</option>';
    json.data.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat.category_id;
      opt.textContent = cat.category_name;
      select.appendChild(opt);
    });
  } catch (err) {
    console.error("Error loading categories:", err);
  }
}

/* ---------------------------
   3. ADD PRODUCT
-----------------------------*/
async function submitAddProduct(event) {
  event.preventDefault();
  const form = event.target;
  const data = Object.fromEntries(new FormData(form).entries());

  data.category_id = Number(data.category_id); // required
  data.price = Number(data.price);
  data.retail_price = data.retail_price ? Number(data.retail_price) : null;
  data.active = Number(data.active);
  data.quantity = Number(data.quantity);

  const res = await fetch(API_BASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const json = await res.json();
  document.getElementById("successMessage").innerText = json.message || "Product added/failed.";
  new bootstrap.Modal(document.getElementById("successModal")).show();

  const addModalEl = document.getElementById("addProductModal");
  const addModal = bootstrap.Modal.getInstance(addModalEl);
  if (addModal) addModal.hide();

  form.reset();
  loadProducts();
}

/* ---------------------------
   4. VIEW PRODUCT (placeholder)
-----------------------------*/
function viewProduct(id) {
  alert("Viewing Product ID: " + id);
}

/* ---------------------------
   5. DELETE PRODUCT
-----------------------------*/
function deleteProduct(id) {
  document.getElementById("delete_product_id").value = id;
  new bootstrap.Modal(document.getElementById("deleteConfirmModal")).show();
}

async function confirmDelete() {
  const id = document.getElementById("delete_product_id").value;
  const res = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
  const json = await res.json();

  const deleteModalEl = document.getElementById("deleteConfirmModal");
  const deleteModal = bootstrap.Modal.getInstance(deleteModalEl);
  if (deleteModal) deleteModal.hide();

  document.getElementById("successMessage").innerText = json.message || "Deletion failed.";
  new bootstrap.Modal(document.getElementById("successModal")).show();

  loadProducts();
}

/* ---------------------------
   6. EXPORT CSV/PDF
-----------------------------*/
function exportCSV() { window.location.href = `${API_BASE}/export/csv`; }
function exportPDF() { window.location.href = `${API_BASE}/export/pdf`; }

/* ---------------------------
   7. LOAD EXTERNAL PRODUCTS
-----------------------------*/
const EXTERNAL_API_BASE = "http://localhost:3000/api/external";

async function loadExternalProducts() {
  const confirmation = confirm("Are you sure you want to fetch and save products from the external API?");
  if (!confirmation) return;

  document.getElementById("status").innerText = "Fetching external products...";
  try {
    const res = await fetch(`${EXTERNAL_API_BASE}/fetch-external-products`, { method: "POST" });
    const json = await res.json();
    document.getElementById("successMessage").innerText = json.message || json.error || "Operation completed.";
    new bootstrap.Modal(document.getElementById("successModal")).show();
    loadProducts();
  } catch (err) {
    console.error("External API fetch error:", err);
    document.getElementById("status").innerText = "Failed to fetch external products.";
    document.getElementById("successMessage").innerText = "Error: Failed to connect to external API.";
    new bootstrap.Modal(document.getElementById("successModal")).show();
  }
}

/* ---------------------------
   8. PAGE LOAD
-----------------------------*/
window.onload = () => {
  loadProducts();
  loadCategories();
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="successModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Status</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="successMessage">
        Action completed successfully!
      </div>
    </div>
  </div>
</div>
</body>
</html>
