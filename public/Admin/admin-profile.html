<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">
    <h2><i class="fa-solid fa-pen"></i> Edit Profile</h2>
    <hr>

    <form id="profile-form" class="p-4 bg-white shadow-sm rounded">

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">New Username</label>
        <input type="text" id="New_username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Current Email (read-only)</label>
        <input type="email" id="email" class="form-control" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="password" class="form-control">
    </div>

    <button class="btn btn-primary w-100" type="submit">Save Changes</button>

</form>


</div>

<script src="../js/admin-profile.js"></script>
</body>
</html>
