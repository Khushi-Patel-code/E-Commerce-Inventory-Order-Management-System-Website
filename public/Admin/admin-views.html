<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Views</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fc;
        }
        /* Sidebar styles from admin-dashboard */
        .sidebar {
            height: 100vh;
            background: #343a40;
            padding-top: 20px;
            width: 210px;
        }
        .sidebar a {
            color: white;
            padding: 12px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content-area {
            margin-left: 230px;
            padding: 20px;
        }

        /* Custom Card Style for Views */
        .view-card {
            /* Make the card clickable and styled like a button */
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border-left: 5px solid #0d6efd; /* Highlight border */
            min-height: 120px; /* Ensure consistent height */
        }
        .view-card:hover {
            /* Hover Effect */
            background-color: #e9ecef; /* Light gray background on hover */
            border-left: 5px solid #144e99; /* Darker blue border on hover */
            transform: translateY(-2px); /* Slight lift */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .view-card h5 {
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>

    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html" style="background:#495057;"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line me-2"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<div class="content-area">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa fa-table"></i> SQL Database Views</h2>
        <button class="btn btn-light" type="button" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-2x"></i>
        </button>
    </div>

    <p class="text-muted">Click on a view card to display the data for that specific SQL View.</p>

    <div class="row g-4">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // List of your SQL View names
    const sqlViews = [
        { name: "customer_order_summary", icon: "fa-regular fa-folder-open" },
        { name: "high_rated_products", icon: "fa-regular fa-star" },
        { name: "above_average_sales", icon: "fa-solid fa-arrow-trend-up" },
        { name: "customers_orders", icon: "fa-solid fa-arrows-left-right" },
        { name: "pending_payments", icon: "fa-regular fa-credit-card" },
        { name: "low_stock_products", icon: "fa-solid fa-warehouse" },
        { name: "category_wise_sales", icon: "fa-solid fa-chart-bar" },
        { name: "most_reliable_suppliers", icon: "fa-solid fa-truck-field" },
        { name: "product_performance", icon: "fa-solid fa-gauge-high" },
        { name: "payment_summary", icon: "fa-solid fa-money-check-dollar" }
    ];

    /**
     * Navigates to a new page to display the specific view's data.
     * We pass the view name as a URL parameter.
     * @param {string} viewName - The name of the SQL view.
     */
    function showViewData(viewName) {
        // You will create this 'view-data.html' page next
        window.location.href = `view-data.html?view=${viewName}`;
    }

    /**
     * Renders the cards into the HTML document.
     */
    function renderViewCards() {
        const container = document.querySelector('.row.g-4');
        let html = '';

        sqlViews.forEach(view => {
            // Create a card for each view
            html += `
                <div class="col-md-4">
                    <div class="card shadow-sm p-3 view-card" onclick="showViewData('${view.name}')">
                        <i class="${view.icon} fa-3x text-primary mb-2"></i>
                        <h5>${view.name.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ')}</h5>
                        <p class="text-muted small">Click to view data</p>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // Render the cards when the page loads
    window.onload = renderViewCards;
</script>

</body>
</html>
