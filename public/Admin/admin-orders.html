<!--admin-orders.html-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Orders</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fc; }
        .sidebar {
            height: 100vh; 
            width: 210px;
            background: #343a40; 
            padding-top: 20px;
        }
        .sidebar a {
            color: white; padding: 12px;
            display: block; text-decoration: none;
        }
        .sidebar a:hover { background: #495057; }
        .content-area { margin-left: 230px; padding: 20px; }
        table th, table td { vertical-align: middle !important; }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>
    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html" style="background:#495057;"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line me-2"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<!-- CONTENT PANEL -->
<div class="content-area">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa fa-shopping-cart"></i> Orders</h2>

        <button class="btn btn-light" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-3x"></i>
        </button>
    </div>

    <!-- ACTION CARD -->
    <div class="card shadow-sm p-4">

        <!-- Search Row -->
        <div class="d-flex mb-3">
            <input id="searchOrderId" class="form-control me-2" placeholder="Search Order ID">
            <button class="btn btn-dark" onclick="searchOrderById()"><i class="fa fa-search"></i></button>
        </div>

        <!-- Buttons -->
        <div class="mb-3">
            <button class="btn btn-primary me-2" onclick="currentFilterStatus = ''; loadOrders()">Load Recent Orders</button>
            <button class="btn btn-secondary me-2" onclick="openFilterModal()">
            <i class="fa fa-filter me-1"></i> Filter Orders</button>
            
            <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addOrderModal">
                <i class="fa fa-plus"></i> Add Order
            </button>

            <button class="btn btn-warning me-2" onclick="exportCSV()"><i class="fa-solid fa-file-csv me-1"></i> Export CSV</button>
            <button class="btn btn-danger" onclick="exportPDF()"><i class="fa-solid fa-file-pdf me-1"></i> Export PDF</button>
        </div>

        <!-- Status Filter -->
<div class="d-flex mb-3">
  <label for="statusFilter" class="me-2">Filter by status:</label>
  <select id="statusFilter" class="form-select w-auto me-2">
    <option value="">All</option>
    <option value="pending">Pending</option>
    <option value="processed">Processed</option>
    <option value="shipped">Shipped</option>
    <option value="delivered">Delivered</option>
    <option value="cancelled">Cancelled</option>
  </select>
  <button class="btn btn-secondary" onclick="loadOrders()">Apply</button>
</div>

        <div id="status" class="text-muted mb-2"></div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead id="ordersHead"></thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!--ADD ORDER MODAL -->
<div class="modal fade" id="addOrderModal">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="submitAddOrder(event)">
            <div class="modal-header">
                <h5 class="modal-title">Add New Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <label>Order Number</label>
                <input class="form-control mb-2" name="order_number" required>

                <label>Customer ID</label>
                <input class="form-control mb-2" name="customer_id" required>

                <label>Status</label>
                <select class="form-control mb-2" name="order_status">

                    <option value="">Select order Status</option>
                    <option>pending</option>
                    <option>processed</option>
                    <option>shipped</option>
                    <option>delivered</option>
                    <option value="">cancelled</option>
                </select>

                <label>Shipping Address</label>
                <input class="form-control mb-2" name="shipping_address">

                <label>Subtotal</label>
                <input type="number" class="form-control mb-2" name="subtotal" step="0.01">

                <label>Total</label>
                <input type="number" class="form-control mb-2" name="total" step="0.01">

            </div>

            <div class="modal-footer">
                <button class="btn btn-primary">Add Order</button>
            </div>
        </form>
    </div>
</div>

<!-- UPDATE ORDER MODal -->
<div class="modal fade" id="updateOrderModal">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="submitUpdateOrder(event)">
            <div class="modal-header">
                <h5 class="modal-title">Update Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="update_order_id">

                <label>Status</label>
                <select class="form-control mb-2" id="update_status">
                    <option value="pending">pending</option>
                    <option value="processed">processed</option>
                    <option value="shipped">shipped</option>
                    <option value="delivered">delivered</option>
                    <option value="cancelled">cancelled</option>
                </select>


                <label>Shipping Address</label>
                <input class="form-control mb-2" id="update_shipping_address">

                <label>Total</label>
                <input type="number" class="form-control mb-2" id="update_total" step="0.01">
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-warning">Update Order</button>
            </div>
        </form>
    </div>
</div>


<script>
const API_BASE = "http://localhost:3000/api/orders";

/* LOAD RECENT ORDERS */
async function loadOrders() {
    document.getElementById("status").innerText = "Loading...";

    const status = document.getElementById("statusFilter")?.value || "";
    let url = `${API_BASE}`;
    if (status) {
        url += `?status=${encodeURIComponent(status)}`;
    }

    const res = await fetch(url);
    const json = await res.json();

    if (!json.success) return;

    const rows = json.data;

    let head = `
        <tr class="table-dark">
            <th>ID</th>
            <th>Order #</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Date</th>
            <th>Total</th>
            <th>Actions</th>
        </tr>
    `;

        let body = "";
        rows.forEach(o => {
            body += `
                <tr>
                    <td>${o.order_id}</td>
                    <td>${o.order_number}</td>
                    <td>${o.customer_first_name} ${o.customer_last_name}</td>
                    <td>${o.order_status}</td>
                    <td>${new Date(o.order_date).toLocaleString()}</td>
                    <td>$${o.total}</td>
                    <td>
                        <button class="btn btn-sm btn-info me-1" onclick="viewOrder(${o.order_id})">
                            <i class="fa fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-warning me-1" onclick='openUpdateModal(${JSON.stringify(o)})'>
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteOrder(${o.order_id})">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

    document.getElementById("ordersHead").innerHTML = head;
    document.getElementById("ordersBody").innerHTML = body;

    document.getElementById("status").innerText = 
      `Showing ${rows.length} ${status ? `orders with status "${status}"` : "recent orders"}.`;


    //document.getElementById("status").innerText = `Showing ${rows.length} recent orders.`;
}

/* SEARCH ORDER BY ID */
async function searchOrderById() {
    // ... (Your original searchOrderById function) ...
    const id = document.getElementById("searchOrderId").value;
    if (!id) return alert("Enter an Order ID!");

    const res = await fetch(`${API_BASE}/${id}`);
    
    if (!res.ok) {
        showError("Order not found or API error.");
        return;
    }
    
    const json = await res.json();

    const o = json.data;

    document.getElementById("ordersHead").innerHTML = `
        <tr class="table-dark">
            <th>ID</th><th>Order #</th><th>Customer</th><th>Status</th><th>Date</th><th>Total</th>
        </tr>
    `;

    document.getElementById("ordersBody").innerHTML = `
        <tr>
            <td>${o.order_id}</td>
            <td>${o.order_number}</td>
            <td>${o.customer_first_name} ${o.customer_last_name}</td>
            <td>${o.order_status}</td>
            <td>${new Date(o.order_date).toLocaleString()}</td>
            <td>$${o.total}</td>
        </tr>
    `;
    document.getElementById("status").innerText = `Showing result for Order ID: ${id}.`;
}



/* EXPORT CSV */
async function exportCSV() {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API_BASE}/export/csv`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    if (!res.ok) {
        const text = await res.text();
        alert(`Failed to export CSV: ${text}`);
        return;
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'orders.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
}

/* EXPORT PDF */
async function exportPDF() {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API_BASE}/export/pdf`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    if (!res.ok) {
        const text = await res.text();
        alert(`Failed to export PDF: ${text}`);
        return;
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'orders.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
}



/* OPEN UPDATE MODAL */
function openUpdateModal(order) {
    document.getElementById("update_order_id").value = order.order_id;
    document.getElementById("update_status").value = order.order_status;
    document.getElementById("update_shipping_address").value = order.shipping_address;
    document.getElementById("update_total").value = order.total;

    new bootstrap.Modal(document.getElementById("updateOrderModal")).show();
}

/* SUBMIT UPDATE */
async function submitUpdateOrder(event) {

    event.preventDefault();
    const id = document.getElementById("update_order_id").value;
   
    //debug
    console.log("submitUpdateOrder fired for order", id);
    
    const data = {
        order_status: document.getElementById("update_status").value,
        shipping_address: document.getElementById("update_shipping_address").value,
        total: document.getElementById("update_total").value,
    };
    const token = localStorage.getItem('token');

    //debug
    console.log("Token being sent:", token);

    const res = await fetch(`${API_BASE}/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(data)
    });

    const json = await res.json();
    document.getElementById("successMessage").innerText = json.message;
    new bootstrap.Modal(document.getElementById("successModal")).show();

    const updateModalEl = document.getElementById("updateOrderModal");
    const updateModal = bootstrap.Modal.getInstance(updateModalEl);
    if (updateModal) updateModal.hide();

        loadOrders();
    } catch (error) {
        showError("Could not connect to the API server for update.");
    }
}

/* DELETE ORDER (CONFIRM MODAL) */
function deleteOrder(id) {
    document.getElementById("delete_order_id").value = id;
    new bootstrap.Modal(document.getElementById("deleteConfirmModal")).show();
}

async function confirmDelete() {
    const id = document.getElementById("delete_order_id").value;
    const token = localStorage.getItem('token');

    const res = await fetch(`${API_BASE}/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });

    const json = await res.json();
    document.getElementById("successMessage").innerText = json.message;
    new bootstrap.Modal(document.getElementById("successModal")).show();

    loadOrders();
}

window.onload = loadOrders;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="successModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Success</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="successMessage">
        Action completed successfully!
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal fade" id="deleteConfirmModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Delete</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this order?
        <input type="hidden" id="delete_order_id">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="filterStatusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title">Filter Orders by Status</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="filterStatusSelect" class="form-label">Select Order Status:</label>
                <select class="form-select" id="filterStatusSelect">
                    <option value="">-- Show All Orders --</option>
                    <option value="pending">Pending</option>
                    <option value="processed">Processed</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyStatusFilter()">Apply Filter</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
