<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Customers</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fc; }
        .sidebar {
            height: 100vh; 
            width: 210px;
            background: #343a40; 
            padding-top: 20px;
        }
        .sidebar a {
            color: white; padding: 12px;
            display: block; text-decoration: none;
        }
        .sidebar a:hover { background: #495057; }
        .content-area { margin-left: 230px; padding: 20px; }
        table th, table td { vertical-align: middle !important; }
    </style>
</head>

<body onload="loadCustomers()">

<!-- SIDEBAR -->
<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>
    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html" style="background:#495057;"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line me-2"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<!-- CONTENT PANEL -->
<div class="content-area">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa fa-users"></i> Customers</h2>

        <button class="btn btn-light" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-3x"></i>
        </button>
    </div>

    <!-- ACTION CARD -->
    <div class="card shadow-sm p-4">

        <!-- Search Row -->
        <div class="d-flex mb-3">
            <input id="searchCustomerId" class="form-control me-2" placeholder="Search Customer ID">
            <button class="btn btn-dark" onclick="searchCustomerById()"><i class="fa fa-search"></i></button>
        </div>

        <!-- Buttons -->
        <div class="mb-3">
            <button class="btn btn-primary me-2" onclick="loadCustomers()">Load Recent Customers</button>

            <!-- ⭐ Add Customer Button -->
            <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                <i class="fa fa-plus"></i> Add Customer
            </button>

            <button class="btn btn-warning me-2" onclick="exportCSV()">Export CSV</button>
            <button class="btn btn-danger" onclick="exportPDF()">Export PDF</button>
        </div>

        <div id="status" class="text-muted mb-2"></div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead id="customersHead"></thead>
                <tbody id="customersBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ADD CUSTOMER MODAL -->
<div class="modal fade" id="addCustomerModal">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="submitAddCustomer(event)">
            <div class="modal-header">
                <h5 class="modal-title">Add New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <label>First Name</label>
                <input class="form-control mb-2" name="first_name" required>

                <label>Last Name</label>
                <input class="form-control mb-2" name="last_name" required>

                <label>Email</label>
                <input type="email" class="form-control mb-2" name="email" required>

                <label>Password</label>
                <input type="password" class="form-control mb-2" name="password" required>

                <label>Phone</label>
                <input class="form-control mb-2" name="phone">

                <label>Shipping Address</label>
                <input class="form-control mb-2" name="shipping_address">

                <label>Billing Address</label>
                <input class="form-control mb-2" name="billing_address">
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary">Add Customer</button>
            </div>
        </form>
    </div>
</div>

<!-- UPDATE CUSTOMER MODAL -->
<div class="modal fade" id="updateCustomerModal">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="submitUpdateCustomer(event)">
            <div class="modal-header">
                <h5 class="modal-title">Update Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="update_customer_id">

                <label>First Name</label>
                <input class="form-control mb-2" id="update_first_name" required>

                <label>Last Name</label>
                <input class="form-control mb-2" id="update_last_name" required>

                <label>Email</label>
                <input type="email" class="form-control mb-2" id="update_email" required>

                <label>Phone</label>
                <input class="form-control mb-2" id="update_phone">

                <label>Shipping Address</label>
                <input class="form-control mb-2" id="update_shipping_address">

                <label>Billing Address</label>
                <input class="form-control mb-2" id="update_billing_address">

                <div class="alert alert-info mt-3">
                    Leave <strong>Password</strong> blank to keep current password.
                </div>

                <label>New Password (Optional)</label>
                <input type="password" class="form-control mb-2" id="update_password">
            </div>

            <div class="modal-footer">
                <button class="btn btn-warning">Update Customer</button>
            </div>
        </form>
    </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal fade" id="successModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Success</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="successMessage">
        Action completed successfully!
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal fade" id="deleteConfirmModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Delete</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this customer?
        <input type="hidden" id="delete_customer_id">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:3000/customers";

/* LOAD CUSTOMERS */
async function loadCustomers() {
    document.getElementById("status").innerText = "Loading...";

        const res = await fetch(`${API_BASE}`);
        const json = await res.json();

        if (!json.success) throw new Error("Failed to fetch customers");

        let head = `
            <tr class="table-dark">
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Shipping Address</th>
                <th>Registered</th>
                <th>Actions</th>
            </tr>
        `;

        let body = "";
        json.data.forEach(c => {
            body += `
                <tr>
                    <td>${c.customer_id}</td>
                    <td>${c.first_name} ${c.last_name}</td>
                    <td>${c.email}</td>
                    <td>${c.phone || 'N/A'}</td>
                    <td>${c.shipping_address || 'N/A'}</td>
                    <td>${new Date(c.created_at).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm btn-info me-1" onclick="viewCustomer(${c.customer_id})">
                            <i class="fa fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-warning me-1" onclick='openUpdateModal(${JSON.stringify(c)})'>
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.customer_id})">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

    document.getElementById("customersHead").innerHTML = head;
    document.getElementById("customersBody").innerHTML = body;
    document.getElementById("status").innerText = `Showing recent customers.`;
    
}

/* Attach loadCustomers to window.onload */
window.addEventListener("DOMContentLoaded", loadCustomers);

/* SEARCH CUSTOMER */
async function searchCustomerById() {
    const id = document.getElementById("searchCustomerId").value;
    if (!id) return alert("Enter a Customer ID!");

    const res = await fetch(`${API_BASE}/${id}`);
    const json = await res.json();

    if (!json.success) return alert("Customer not found");

    const c = json.customer;
    document.getElementById("customersHead").innerHTML = `
        <tr class="table-dark">
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Shipping Address</th><th>Registered</th>
        </tr>
    `;

    document.getElementById("customersBody").innerHTML = `
        <tr>
            <td>${c.customer_id}</td>
            <td>${c.first_name} ${c.last_name}</td>
            <td>${c.email}</td>
            <td>${c.phone || 'N/A'}</td>
            <td>${c.shipping_address || 'N/A'}</td>
            <td>${new Date(c.created_at).toLocaleDateString()}</td>
        </tr>
    `;
}

/* ADD CUSTOMER */
async function submitAddCustomer(event) {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target).entries());
    const res = await fetch(`${API_BASE}/register`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    const json = await res.json();
    document.getElementById("successMessage").innerText = json.message;
    new bootstrap.Modal(document.getElementById("successModal")).show();
    event.target.reset();
    loadCustomers();
    bootstrap.Modal.getInstance(document.getElementById("addCustomerModal")).hide();
}

/* UPDATE CUSTOMER */
function openUpdateModal(c) {
    document.getElementById("update_customer_id").value = c.customer_id;
    document.getElementById("update_first_name").value = c.first_name;
    document.getElementById("update_last_name").value = c.last_name;
    document.getElementById("update_email").value = c.email;
    document.getElementById("update_phone").value = c.phone;
    document.getElementById("update_shipping_address").value = c.shipping_address;
    document.getElementById("update_billing_address").value = c.billing_address;
    document.getElementById("update_password").value = "";
    new bootstrap.Modal(document.getElementById("updateCustomerModal")).show();
}

async function submitUpdateCustomer(event) {
    event.preventDefault();
    const id = document.getElementById("update_customer_id").value;
    const data = {
        first_name: document.getElementById("update_first_name").value,
        last_name: document.getElementById("update_last_name").value,
        email: document.getElementById("update_email").value,
        phone: document.getElementById("update_phone").value,
        shipping_address: document.getElementById("update_shipping_address").value,
        billing_address: document.getElementById("update_billing_address").value
    };
    const password = document.getElementById("update_password").value;
    if(password) data.password = password;

    const res = await fetch(`${API_BASE}/${id}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    const json = await res.json();

    document.getElementById("successMessage").innerText = json.message;
    new bootstrap.Modal(document.getElementById("successModal")).show();
    bootstrap.Modal.getInstance(document.getElementById("updateCustomerModal")).hide();
    loadCustomers();
}

/* DELETE CUSTOMER */
function deleteCustomer(id) {
    document.getElementById("delete_customer_id").value = id;
    new bootstrap.Modal(document.getElementById("deleteConfirmModal")).show();
}

async function confirmDelete() {
    const id = document.getElementById("delete_customer_id").value;
    const res = await fetch(`${API_BASE}/${id}`, {method:"DELETE"});
    const json = await res.json();
    document.getElementById("successMessage").innerText = json.message;
    new bootstrap.Modal(document.getElementById("successModal")).show();
    bootstrap.Modal.getInstance(document.getElementById("deleteConfirmModal")).hide();
    loadCustomers();
}

/* EXPORTS */
function exportCSV() { window.location.href = `${API_BASE}/export/csv`; }
function exportPDF() { window.location.href = `${API_BASE}/export/pdf`; }
function viewCustomer(id) { alert(`View details for Customer ID: ${id} (To be implemented)`); }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
