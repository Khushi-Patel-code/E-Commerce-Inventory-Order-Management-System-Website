<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Data</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* CSS from admin-views.html for sidebar and content */
        body { background-color: #f8f9fc; }
        .sidebar { height: 100vh; background: #343a40; padding-top: 20px; width: 210px; }
        .sidebar a { color: white; padding: 12px; display: block; text-decoration: none; }
        .sidebar a:hover { background: #495057; }
        .content-area { margin-left: 230px; padding: 20px; }
    </style>
</head>
<body>

<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>
    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html" style="background:#495057;"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<div class="content-area">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="view-title"><i class="fa fa-table"></i> Loading View...</h2>
        <button class="btn btn-light" type="button" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-2x"></i>
        </button>
    </div>
    
    <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-secondary" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left"></i> Back to Views
        </button>
        
        <div id="export-buttons" class="d-none">
            <button class="btn btn-success me-2" onclick="handleExport('csv')">
                <i class="fa-solid fa-file-csv me-1"></i> Export CSV
            </button>
            <button class="btn btn-danger" onclick="handleExport('pdf')">
                <i class="fa-solid fa-file-pdf me-1"></i> Export PDF
            </button>
        </div>
    </div>
    <div class="card shadow-sm p-4">
        <div id="status" class="text-muted mb-3"></div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead id="viewHead"></thead>
                <tbody id="viewBody"></tbody>
            </table>
        </div>

        <div id="error-message" class="alert alert-danger d-none mt-3"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_BASE = "http://localhost:3000/api/views"; 
    let currentViewName = ''; // Global variable to store the view name

    // Function to format the view name for display
    function formatViewName(name) {
        return name.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }
    
    //Handles the click event for CSV and PDF exports.
    function handleExport(format) {
        if (!currentViewName) {
            alert('Error: Cannot export. View name not loaded.');
            return;
        }
        // Constructs the URL based on your views.js route structure
        const exportUrl = `${API_BASE}/export/${currentViewName}/${format}`;
        
        // This triggers the file download from the server
        window.location.href = exportUrl;
    }

    async function loadViewData() {
        // 1. Get the view name from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const viewName = urlParams.get('view');

        if (!viewName) {
            document.getElementById("view-title").innerText = "Error: No View Selected";
            document.getElementById("status").innerText = "";
            document.getElementById("error-message").innerText = "Please select a view from the SQL Views page.";
            document.getElementById("error-message").classList.remove('d-none');
            return;
        }

        // Store the view name globally
        currentViewName = viewName; 

        // 2. Set the title and show export buttons
        const formattedName = formatViewName(viewName);
        document.getElementById("view-title").innerHTML = `<i class="fa fa-table"></i> ${formattedName} View`;
        document.getElementById("status").innerText = `Fetching data for ${formattedName}...`;
        
        // Ensure export buttons are visible once a view name is set
        document.getElementById('export-buttons').classList.remove('d-none');

        try {
            // 3. Call the backend API to execute the SQL View query
            const res = await fetch(`${API_BASE}/${viewName}`);
            const json = await res.json();

            if (!res.ok || json.error) {
                throw new Error(json.error || `Failed to fetch data. Status: ${res.status}`);
            }

            // 4. Render the data table
            renderTable(json.data);

        } catch (error) {
            console.error("Error fetching view data:", error);
            document.getElementById("status").innerText = "";
            document.getElementById("error-message").innerText = `An error occurred: ${error.message}`;
            document.getElementById("error-message").classList.remove('d-none');
        }
    }

    function renderTable(data) {
        const headContainer = document.getElementById("viewHead");
        const bodyContainer = document.getElementById("viewBody");
        
        // Clear previous content
        headContainer.innerHTML = '';
        bodyContainer.innerHTML = '';

        if (!data || data.length === 0) {
            document.getElementById("status").innerText = "View ran successfully, but returned no data.";
            bodyContainer.innerHTML = '<tr><td colspan="100" class="text-center">No records found for this view.</td></tr>';
            return;
        }

        // Get column names (keys from the first object)
        const columns = Object.keys(data[0]);

        // Build Table Head
        let headHtml = '<tr class="table-dark">';
        columns.forEach(col => {
            // Format column names for display (e.g., 'customer_name' -> 'Customer Name')
            const formattedCol = formatViewName(col); 
            headHtml += `<th>${formattedCol}</th>`;
        });
        headHtml += '</tr>';
        headContainer.innerHTML = headHtml;

        // Build Table Body
        let bodyHtml = '';
        data.forEach(row => {
            bodyHtml += '<tr>';
            columns.forEach(col => {
                // Display the value, handling null or undefined gracefully
                const value = row[col] !== null && row[col] !== undefined ? row[col] : 'N/A';
                bodyHtml += `<td>${value}</td>`;
            });
            bodyHtml += '</tr>';
        });
        bodyContainer.innerHTML = bodyHtml;

        document.getElementById("status").innerText = `Successfully loaded ${data.length} records.`;
    }

    // Start the process when the page loads
    window.onload = loadViewData;
</script>
</body>
</html>
