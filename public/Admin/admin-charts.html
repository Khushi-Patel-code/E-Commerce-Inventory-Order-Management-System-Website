<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Charts Overview</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fc; }
        .sidebar {
            height: 100vh;
            background: #343a40;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 12px;
            display: block;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content-area {
            margin-left: 230px;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>

    <a href="admin-dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie"></i> Charts</a>
</div>

<div class="content-area">
    <h2>Charts Overview</h2>
    <p class="text-muted">Sales, revenue and category performance charts.</p>

    <div class="row mt-4">
        <div class="col-md-8 chart-container">
            <h4>Revenue vs Date</h4>
            <canvas id="revenueChart"></canvas>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-4 chart-container">
            <h4>Revenue by Category</h4>
            <canvas id="categoryDonut"></canvas>
        </div>
    </div>


    <div class="row mt-5">
        <div class="col-md-8 chart-container">
            <h4>Top Selling Products</h4>
            <canvas id="topProducts"></canvas>
        </div>
    </div>
</div>


<style>
.chart-container {
    height: 400px;
    margin-left: 230px;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/admin-charts.js"></script>

</body>
</html>
