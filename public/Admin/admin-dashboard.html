<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fc;
        }
        .sidebar {
            height: 100vh;
            background: #343a40;
            padding-top: 20px;
            width: 210px;
        }
        .sidebar a {
            color: white;
            padding: 12px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content-area {
            margin-left: 230px;
            padding: 20px;
        }
        .stats .card.shadow-sm {
            cursor: pointer;
        }
        .card-hover-effect {
        cursor: pointer;
        transition: all 0.3s ease;
        }
        .card-hover-effect:hover {
            transform: translateY(-5px); 
        }
        .chart-container {
            height: 475px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

    </style>

</head>

<body>

<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>

    <a href="admin-dashboard.html"><i class="fa fa-home me-2"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box me-2"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users me-2"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table me-2"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line me-2"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie me-2"></i> Charts</a>
    <a href="../staff-login.html"><i class="fa-solid fa-person-running me-2"></i> Logout</a>
</div>

<div class="content-area">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Welcome back, <span id="admin-name" style="text-transform: uppercase;">ADMIN</span></h2>

    <!-- USER -->
    <div class="dropdown">
        <button class="btn btn-light" type="button" onclick="window.location.href='admin-profile.html'">
            <i class="fa fa-user-circle fa-3x"></i>
        </button>
    </div>
</div>

    <!-- STAT CARDS -->
    <div class="row g-3 stats">
        <div class="col-md-3">
            <div class="card shadow-sm p-3 card-hover-effect" onclick="window.location.href='admin-charts.html'">
                <h5>Total Revenue<i class="fa-solid fa-sack-dollar"></i></h5>
                <h3 id="count-revenue">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3 card-hover-effect" onclick="window.location.href='admin-products.html'">
                <h5>Products<i class="fa-solid fa-box-open"></i></h5>
                <h3 id="count-products">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3 card-hover-effect" onclick="window.location.href='admin-users.html'">
                <h5>Customers<i class="fa-solid fa-users"></i></h5>
                <h3 id="count-customers">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3 card-hover-effect" onclick="window.location.href='admin-orders.html'">
                <h5>Orders<i class="fa-solid fa-cart-shopping"></i></h5>
                <h3 id="count-orders">0</h3>
            </div>
        </div>
    </div>


    <!-- CHART AREA -->

<!-- Row 1: Chart 1 & Chart 2 -->
<div class="row mt-4 g-3">
    
    <div class="col-md-8">
        <div class="card shadow-sm p-3 chart-container">
            <h4>Revenue V/S Date</h4>
            <canvas id="revenueChart"></canvas>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm p-3 chart-container">
            <h4>Revenue by Category</h4>
            <canvas id="categoryDonut"></canvas>
        </div>
    </div>
</div>

<div class="row mt-4 g-3"> 
    
    <div class="col-md-8">
        <div class="card shadow-sm p-3 chart-container">
            <h4>Top Selling Products</h4>
            <canvas id="topProducts"></canvas>
        </div>
    </div>
    
    <div class="col-md-4">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/admin-dashboard.js"></script>

</body>
</html>
