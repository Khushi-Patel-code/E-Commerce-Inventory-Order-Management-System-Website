<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fc;
        }
        .sidebar {
            height: 100vh;
            background: #343a40;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 12px;
            display: block;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content-area {
            margin-left: 230px;
            padding: 20px;
        }
    </style>

</head>

<body>

<div class="sidebar position-fixed">
    <h4 class="text-center text-white">Admin Panel</h4>

    <a href="admin-dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
    <a href="admin-products.html"><i class="fa fa-box"></i> Products</a>
    <a href="admin-orders.html"><i class="fa fa-shopping-cart"></i> Orders</a>
    <a href="admin-users.html"><i class="fa fa-users"></i> Users</a>
    <a href="admin-views.html"><i class="fa fa-table"></i> SQL Views</a>
    <a href="admin-reports.html"><i class="fa fa-chart-line"></i> Reports</a>
    <a href="admin-charts.html"><i class="fa fa-chart-pie"></i> Charts</a>
</div>

<div class="content-area">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Welcome back, <span id="admin-name" style="text-transform: uppercase;">Admin</span> 👋</h2>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <!-- STAT CARDS -->
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h5>Total Products</h5>
                <h3 id="count-products">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h5>Total Categories</h5>
                <h3 id="count-categories">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h5>Low Inventory</h5>
                <h3 id="low-stock">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-3">
                <h5>Total Orders</h5>
                <h3 id="count-orders">0</h3>
            </div>
        </div>
    </div>

    <hr class="my-4">

    <!-- CHART AREA -->
    <h4>Inventory & Sales Overview</h4>

    <div class="row">
        <div class="col-md-6">
            <canvas id="barChart"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

</div>


<!-- JS Files -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/admin-dashboard.js"></script>

</body>
</html>
