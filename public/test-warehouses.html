<!DOCTYPE html>
<html>
<head>
  <title>Test Warehouses CRUD</title>
</head>
<body>

  <h1>Warehouse CRUD Test Page</h1>

  <!--------------- CREATE WAREHOUSE --------------->
  <h2>Add Warehouse</h2>
  <form id="createWarehouseForm">
    <input type="text" id="warehouse_name" placeholder="Warehouse Name" required><br>
    <input type="text" id="location" placeholder="Location"><br>
    <input type="text" id="contact_phone" placeholder="Contact Phone"><br>
    <button type="submit">Add Warehouse</button>
  </form>

  <hr>

  <!--------------- READ ALL WAREHOUSES --------------->
  <h2>All Warehouses</h2>
  <button onclick="loadWarehouses()">Load Warehouses</button>
  <table border="1" id="warehouseTable" style="margin-top:10px;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Contact Phone</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr>

  <!--------------- UPDATE WAREHOUSE --------------->
  <h2>Update Warehouse</h2>
  <form id="updateWarehouseForm">
    <input type="number" id="updateId" placeholder="Warehouse ID" required><br>
    <input type="text" id="updateName" placeholder="New Name"><br>
    <input type="text" id="updateLocation" placeholder="New Location"><br>
    <input type="text" id="updateContactPhone" placeholder="New Contact Phone"><br>
    <button type="submit">Update</button>
  </form>

  <hr>

  <!--------------- DELETE WAREHOUSE --------------->
  <h2>Delete Warehouse</h2>
  <input type="number" id="deleteId" placeholder="Warehouse ID" required>
  <button onclick="deleteWarehouse()">Delete</button>

  <hr>
  <h2>Export PDF/CSV</h2>
  <button onclick="window.location.href='/api/warehouses/export/csv'">Export CSV</button>
  <button onclick="window.location.href='/api/warehouses/export/pdf'">Export PDF</button>


<script>
  // ---------- CREATE ----------
  document.getElementById("createWarehouseForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const warehouse = {
      warehouse_name: document.getElementById("warehouse_name").value,
      location: document.getElementById("location").value,
      contact_phone: document.getElementById("contact_phone").value
    };

    const res = await fetch("/api/warehouses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(warehouse)
    });

    const data = await res.json();
    alert(data.message || "Warehouse Added!");
  });

  // ---------- READ ----------
  async function loadWarehouses() {
    const res = await fetch("/api/warehouses");
    const data = await res.json();

    const tbody = document.querySelector("#warehouseTable tbody");
    tbody.innerHTML = "";

    if (data.data && data.data.length > 0) {
      data.data.forEach(w => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${w.warehouse_id}</td>
          <td>${w.warehouse_name}</td>
          <td>${w.location || ""}</td>
          <td>${w.contact_phone || ""}</td>
          <td>${new Date(w.created_at).toLocaleString()}</td>
        `;
        tbody.appendChild(row);
      });
    } else {
      tbody.innerHTML = "<tr><td colspan='5'>No warehouses found</td></tr>";
    }
  }

  // ---------- UPDATE ----------
  document.getElementById("updateWarehouseForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const id = document.getElementById("updateId").value;

    const warehouse = {
      warehouse_name: document.getElementById("updateName").value || null,
      location: document.getElementById("updateLocation").value || null,
      contact_phone: document.getElementById("updateContactPhone").value || null
    };

    const res = await fetch(`/api/warehouses/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(warehouse)
    });

    const data = await res.json();
    alert(data.message || "Warehouse Updated!");
  });

  // ---------- DELETE ----------
  async function deleteWarehouse() {
    const id = document.getElementById("deleteId").value;
    const res = await fetch(`/api/warehouses/${id}`, { method: "DELETE" });
    const data = await res.json();
    alert(data.message || "Warehouse Deleted!");
  }
</script>

</body>
</html>
