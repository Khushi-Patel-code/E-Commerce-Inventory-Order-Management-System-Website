<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .cart-table th, .cart-table td { vertical-align: middle; }
    </style>
</head>
<body>

<!-- NAVBAR -->
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="background: #3b2a4a;">
    <div class="container">
        <a class="navbar-brand" href="customer-dashboard.html">V-Shop</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="customer-products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="customer-orders.html">My Orders</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="customer-login.html">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
 <div class="container my-4">
    <h2 class="mb-4">My Cart</h2>
    <div id="status" class="mb-3 text-muted"></div>

    <table class="table cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
            </tr>
        </thead>
        <tbody id="cartBody"></tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <h5 id="cartTotal">Total: $0.00</h5>
        <button class="btn btn-danger me-2" onclick="clearCart()">Clear Cart</button>
       <!-- <button class="btn btn-success" onclick="placeOrder()">Checkout</button> -->
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#checkoutModal">Checkout</button>
    </div>
</div>


<!-- Checkout Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="checkoutForm">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Checkout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Shipping Address</label>
                        <input type="text" id="shippingAddress" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Billing Address</label>
                        <input type="text" id="billingAddress" class="form-control" required />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Confirm Order</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/cart.js"></script>
</body>
</html>
