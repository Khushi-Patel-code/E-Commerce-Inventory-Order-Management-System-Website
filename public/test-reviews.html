<!DOCTYPE html>
<html>
<head>
  <title>Test Reviews CRUD</title>
</head>
<body>
  <h1>Reviews CRUD Test Page</h1>

  <!-- CREATE REVIEW -->
  <h2>Add Review</h2>
  <form id="createForm">
    <input type="number" id="product_id" placeholder="Product ID" required><br>
    <input type="number" id="user_id" placeholder="User ID" required><br>
    <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5" required><br>
    <textarea id="comment" placeholder="Comment"></textarea><br>
    <button type="submit">Add Review</button>
  </form>

  <hr>

  <!-- READ ALL REVIEWS -->
  <h2>All Reviews</h2>
  <button onclick="loadReviews()">Load Reviews</button>
  <table border="1" id="reviewsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>User</th>
        <th>Rating</th>
        <th>Comment</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr>

  <!-- READ ONE REVIEW -->
  <h2>Find Review by ID</h2>
  <input type="number" id="searchId" placeholder="Enter Review ID">
  <button onclick="getReviewById()">Search</button>
  <div id="reviewDetails"></div>

  <hr>

  <!-- UPDATE REVIEW -->
  <h2>Update Review</h2>
  <form id="updateForm">
    <input type="number" id="updateId" placeholder="Review ID" required><br>
    <input type="number" id="updateRating" placeholder="New Rating (1-5)" min="1" max="5" required><br>
    <textarea id="updateComment" placeholder="New Comment"></textarea><br>
    <button type="submit">Update Review</button>
  </form>

  <hr>

  <!-- DELETE REVIEW -->
  <h2>Delete Review</h2>
  <input type="number" id="deleteId" placeholder="Review ID">
  <button onclick="deleteReview()">Delete</button>

  <h2>Reviews Export</h2>
<button onclick="window.location.href='/api/reviews/export/csv'">Export Reviews CSV</button>
<button onclick="window.location.href='/api/reviews/export/pdf'">Export Reviews PDF</button>

  <script>
    // CREATE
    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const review = {
        product_id: document.getElementById("product_id").value,
        user_id: document.getElementById("user_id").value,
        rating: document.getElementById("rating").value,
        comment: document.getElementById("comment").value
      };

      await fetch("/api/reviews", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(review)
      });

      alert("Review added successfully!");
    });

    // READ ALL
    async function loadReviews() {
      const res = await fetch("/api/reviews");
      const data = await res.json();

      const tbody = document.querySelector("#reviewsTable tbody");
      tbody.innerHTML = "";

      data.data.forEach(r => {
        const row = `<tr>
          <td>${r.review_id}</td>
          <td>${r.product_name || ""}</td>
          <td>${r.username || ""}</td>
          <td>${r.rating}</td>
          <td>${r.comment || ""}</td>
          <td>${r.review_date}</td>
        </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    // READ ONE
    async function getReviewById() {
      const id = document.getElementById("searchId").value;
      if (!id) return alert("Please enter a Review ID");

      const res = await fetch(`/api/reviews/${id}`);
      const data = await res.json();

      const detailsDiv = document.getElementById("reviewDetails");
      detailsDiv.innerHTML = "";

      if (data.success && data.data) {
        const r = data.data;
        detailsDiv.innerHTML = `
          <h3>Review Details:</h3>
          <p><b>ID:</b> ${r.review_id}</p>
          <p><b>Product:</b> ${r.product_name} (ID: ${r.product_id})</p>
          <p><b>User:</b> ${r.username} (ID: ${r.user_id})</p>
          <p><b>Rating:</b> ${r.rating}</p>
          <p><b>Comment:</b> ${r.comment || "N/A"}</p>
          <p><b>Date:</b> ${r.review_date}</p>
        `;
      } else {
        detailsDiv.innerHTML = `<p style="color:red;">${data.message || "Review not found"}</p>`;
      }
    }

    // UPDATE
    document.getElementById("updateForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("updateId").value;
      const rating = document.getElementById("updateRating").value;
      const comment = document.getElementById("updateComment").value;

      await fetch(`/api/reviews/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ rating, comment })
      });

      alert("Review updated!");
    });

    // DELETE
    async function deleteReview() {
      const id = document.getElementById("deleteId").value;
      await fetch(`/api/reviews/${id}`, { method: "DELETE" });
      alert("Review deleted!");
    }
  </script>
</body>
</html>
