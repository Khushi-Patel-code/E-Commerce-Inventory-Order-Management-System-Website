<!--Register New Customer-->

<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration</title>
    <link rel="stylesheet" href="css/customerReg.css">
</head>
<body>
<div class="register-box">
    <h2>Register as Customer</h2>
    <form id="customerRegisterForm">
        <input type="text" name="first_name" placeholder="First Name" required />
        <div id="first_nameError" class="error-message"></div>

        <input type="text" name="last_name" placeholder="Last Name" required />
        <div id="last_nameError" class="error-message"></div>

        <input type="email" name="email" placeholder="Email" required />
        <div id="emailError" class="error-message"></div>

        <input type="password" name="password" placeholder="Password" minlength="6" required />
        <div id="passwordError" class="error-message"></div>

        <input type="text" name="phone" placeholder="Phone" />
        <input type="text" name="billing_address" placeholder="Billing Address"/>
        <input type="text" name="shipping_address" placeholder="Shipping Address" />
        <button type="submit">Register</button>
    </form>
</div>

    <script src="js/customer-auth.js"></script>
</body>
</html>
