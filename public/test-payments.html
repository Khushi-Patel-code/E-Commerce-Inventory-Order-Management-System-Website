<!DOCTYPE html>
<html>
<head>
  <title>Test Payments CRUD</title>
</head>
<body>
  <h1>Payments CRUD Test Page</h1>

  <!-- CREATE PAYMENT -->
  <h2>Add Payment</h2>
  <form id="createForm">
    <input type="number" id="order_id" placeholder="Order ID" required><br>
    <select id="payment_method" required>
      <option value="">Select Payment Method</option>
      <option>card</option>
      <option>paypal</option>
      <option>cod</option>
      <option>bank_transfer</option>
      <option>apple_pay</option>
      <option>google_pay</option>
      <option>gift_card</option>
      <option>crypto</option>
      <option>other</option>
    </select><br>
    <select id="payment_status" required>
      <option value="pending">pending</option>
      <option value="processing">processing</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
      <option value="refunded">refunded</option>
      <option value="cancelled">cancelled</option>
      <option value="chargeback">chargeback</option>
    </select><br>
    <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required><br>
    <input type="datetime-local" id="paid_at" placeholder="Paid At"><br>
    <input type="text" id="transaction_ref" placeholder="Transaction Reference"><br>
    <button type="submit">Add Payment</button>
  </form>

  <hr>

  <!-- READ ALL PAYMENTS -->
  <h2>All Payments</h2>
  <button onclick="loadPayments()">Load Payments</button>
  <table border="1" id="paymentsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Customer ID</th>
        <th>Method</th>
        <th>Status</th>
        <th>Amount</th>
        <th>Paid At</th>
        <th>Transaction Ref</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr>

  <!-- READ ONE PAYMENT -->
  <h2>Find Payment by ID</h2>
  <input type="number" id="searchId" placeholder="Enter Payment ID">
  <button onclick="getPaymentById()">Search</button>
  <div id="paymentDetails"></div>

  <hr>

  <!-- UPDATE PAYMENT -->
  <h2>Update Payment</h2>
  <form id="updateForm">
    <input type="number" id="updateId" placeholder="Payment ID" required><br>
    <select id="updateStatus" required>
      <option value="pending">pending</option>
      <option value="processing">processing</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
      <option value="refunded">refunded</option>
      <option value="cancelled">cancelled</option>
      <option value="chargeback">chargeback</option>
    </select><br>
    <input type="datetime-local" id="updatePaidAt" placeholder="Paid At"><br>
    <input type="text" id="updateTransactionRef" placeholder="Transaction Reference"><br>
    <button type="submit">Update Payment</button>
  </form>

  <hr>

  <!-- DELETE PAYMENT -->
  <h2>Delete Payment</h2>
  <input type="number" id="deleteId" placeholder="Payment ID">
  <button onclick="deletePayment()">Delete</button>

  <script>
    // CREATE
    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payment = {
        order_id: document.getElementById("order_id").value,
        payment_method: document.getElementById("payment_method").value,
        payment_status: document.getElementById("payment_status").value,
        amount: document.getElementById("amount").value,
        paid_at: document.getElementById("paid_at").value || null,
        transaction_ref: document.getElementById("transaction_ref").value || null
      };

      await fetch("/api/payments", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payment)
      });

      alert("Payment added successfully!");
    });

    // READ ALL
    async function loadPayments() {
      const res = await fetch("/api/payments");
      const data = await res.json();

      const tbody = document.querySelector("#paymentsTable tbody");
      tbody.innerHTML = "";

      data.data.forEach(p => {
        const row = `<tr>
          <td>${p.payment_id}</td>
          <td>${p.order_id}</td>
          <td>${p.customer_id}</td>
          <td>${p.payment_method}</td>
          <td>${p.payment_status}</td>
          <td>${p.amount}</td>
          <td>${p.paid_at || ""}</td>
          <td>${p.transaction_ref || ""}</td>
        </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    // READ BY ID
    async function getPaymentById() {
      const id = document.getElementById("searchId").value;
      if (!id) return alert("Please enter a Payment ID");

      const res = await fetch(`/api/payments/${id}`);
      const data = await res.json();

      const detailsDiv = document.getElementById("paymentDetails");
      detailsDiv.innerHTML = "";

      if (data.success && data.data) {
        const p = data.data;
        detailsDiv.innerHTML = `
          <h3>Payment Record:</h3>
          <p><b>ID:</b> ${p.payment_id}</p>
          <p><b>Order ID:</b> ${p.order_id}</p>
          <p><b>Customer ID:</b> ${p.customer_id}</p>
          <p><b>Method:</b> ${p.payment_method}</p>
          <p><b>Status:</b> ${p.payment_status}</p>
          <p><b>Amount:</b> ${p.amount}</p>
          <p><b>Paid At:</b> ${p.paid_at || "N/A"}</p>
          <p><b>Transaction Ref:</b> ${p.transaction_ref || "N/A"}</p>
        `;
      } else {
        detailsDiv.innerHTML = `<p style="color:red;">${data.message || "Payment not found"}</p>`;
      }
    }

    // UPDATE
    document.getElementById("updateForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("updateId").value;
      const payment_status = document.getElementById("updateStatus").value;
      const paid_at = document.getElementById("updatePaidAt").value;
      const transaction_ref = document.getElementById("updateTransactionRef").value;

      await fetch(`/api/payments/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ payment_status, paid_at, transaction_ref })
      });

      alert("Payment updated!");
    });

    // DELETE
    async function deletePayment() {
      const id = document.getElementById("deleteId").value;
      await fetch(`/api/payments/${id}`, { method: "DELETE" });
      alert("Payment deleted!");
    }
  </script>
</body>
</html>
