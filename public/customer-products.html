<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
        .product-img { height: 180px; object-fit: cover; width: 100%; }
        .product-body { padding: 12px; }
        .product-title { font-size: 1.1rem; font-weight: 600; }
        .product-price { color: #007bff; font-weight: bold; }
        .stock-status { font-size: 0.9rem; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="customer-dashboard.html">KPRJ</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="customer-products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="customer-orders.html">My Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="customer-login.html">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container my-4">
    <h2 class="mb-4">Browse Products</h2>
    <div id="status" class="mb-3 text-muted"></div>
    <div id="productsGrid" class="row g-3">
        <!-- Product cards injected here -->
    </div>
</div>

<!-- Add to Cart Success Modal -->
<div class="modal fade" id="addToCartModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header bg-success text-white justify-content-center">
        <h5 class="modal-title">
          <i class="fa fa-check-circle fa-2x me-2"></i> Added to Cart!
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="cartSuccessMessage" class="fs-5"></p>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS bundle (needed for modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<!-- Link to customer-products.js -->
<script src="js/customer-products.js"></script>

</body>
</html>
