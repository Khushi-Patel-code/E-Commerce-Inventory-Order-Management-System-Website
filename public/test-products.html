<!DOCTYPE html>
<html>
<head>
  <title>Test Products CRUD</title>
</head>
<body>

  <h1>Product CRUD Test Page</h1>

  <!--------------- CREATE PRODUCT --------------->
  <h2>Add Product</h2>
  <form id="createForm">
    <input type="text" id="name" placeholder="Product Name" required><br>
    <input type="text" id="sku" placeholder="SKU" required><br>
    <input type="number" id="price" placeholder="Price" step="0.01" required><br>
    <button type="submit">Add Product</button>
  </form>

  <hr>

  <!--------------- READ ALL PRODUCTS --------------->
  <h2>All Products</h2>
  <button onclick="loadProducts()">Load Products</button>
  <ul id="productList"></ul>

  <hr>

  <!--------------- UPDATE PRODUCT --------------->
  <h2>Update Product</h2>
  <form id="updateForm">
    <input type="number" id="updateId" placeholder="Product ID" step="0.01"><br>
    <input type="text" id="updateName" placeholder="New Name"><br>
    <input type="number" id="updatePrice" placeholder="New Price" step="0.01" ><br>
    <button type="submit">Update</button>
  </form>

  <hr>

  <!--------------- DELETE PRODUCT --------------->
  <h2>Delete Product</h2>
  <input type="number" id="deleteId" placeholder="Product ID" step="0.01">
  <button onclick="deleteProduct()">Delete</button>

  <hr>

<script>
  // ---------- CREATE ----------
  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    let product = {
      product_name: document.getElementById("name").value,
      sku: document.getElementById("sku").value,
      price: document.getElementById("price").value
    };

    let res = await fetch("/api/products", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(product)
    });

    alert("Product Added!");
  });

  // ---------- READ ----------
  async function loadProducts() {
    let res = await fetch("/api/products");
    let data = await res.json();

    let ul = document.getElementById("productList");
    ul.innerHTML = "";

    data.data.forEach(p => {
      let li = document.createElement("li");
      li.textContent = `${p.id} — ${p.product_name} — $${p.price}`;
      ul.appendChild(li);
    });
  }

  // ---------- UPDATE ----------
  document.getElementById("updateForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    let id = document.getElementById("updateId").value;

    let product = {
      product_name: document.getElementById("updateName").value,
      price: document.getElementById("updatePrice").value
    };

    await fetch(`/api/products/${id}`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(product)
    });

    alert("Product Updated!");
  });

  // ---------- DELETE ----------
  async function deleteProduct() {
    let id = document.getElementById("deleteId").value;

    await fetch(`/api/products/${id}`, { method: "DELETE" });
    alert("Product Deleted!");
  }
</script>

</body>
</html>
