<!DOCTYPE html>
<html>
<head>
  <title>Test Suppliers CRUD</title>
</head>
<body>
  <h1>Suppliers CRUD Test Page</h1>

  <!-- CREATE SUPPLIER -->
  <h2>Add Supplier</h2>
  <form id="createForm">
    <input type="text" id="supplier_name" placeholder="Supplier Name" required><br>
    <input type="text" id="contact_name" placeholder="Contact Name"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="text" id="phone" placeholder="Phone"><br>
    <input type="text" id="address" placeholder="Address"><br>
    <button type="submit">Add Supplier</button>
  </form>

  <hr>

  <!-- READ SUPPLIERS -->
  <h2>All Suppliers</h2>
  <button onclick="loadSuppliers()">Load Suppliers</button>
  <table border="1" id="supplierTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Supplier Name</th>
        <th>Contact Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr>

  <!-- UPDATE SUPPLIER -->
  <h2>Update Supplier</h2>
  <form id="updateForm">
    <input type="number" id="updateId" placeholder="Supplier ID" required><br>
    <input type="text" id="updateName" placeholder="New Supplier Name"><br>
    <input type="text" id="updateContact" placeholder="New Contact Name"><br>
    <input type="email" id="updateEmail" placeholder="New Email"><br>
    <input type="text" id="updatePhone" placeholder="New Phone"><br>
    <input type="text" id="updateAddress" placeholder="New Address"><br>
    <button type="submit">Update Supplier</button>
  </form>

  <hr>

  <!-- DELETE SUPPLIER -->
  <h2>Delete Supplier</h2>
  <input type="number" id="deleteId" placeholder="Supplier ID">
  <button onclick="deleteSupplier()">Delete</button>

<script>
  // CREATE
  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const supplier = {
      supplier_name: document.getElementById("supplier_name").value,
      contact_name: document.getElementById("contact_name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value
    };

    await fetch("/api/suppliers", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(supplier)
    });

    alert("Supplier Added!");
  });

  // READ
  async function loadSuppliers() {
    const res = await fetch("/api/suppliers");
    const data = await res.json();

    const tbody = document.querySelector("#supplierTable tbody");
    tbody.innerHTML = "";

    data.data.forEach(s => {
      const row = `<tr>
        <td>${s.supplier_id}</td>
        <td>${s.supplier_name}</td>
        <td>${s.contact_name || ""}</td>
        <td>${s.email || ""}</td>
        <td>${s.phone || ""}</td>
        <td>${s.address || ""}</td>
        <td>${s.created_at}</td>
      </tr>`;
      tbody.insertAdjacentHTML("beforeend", row);
    });
  }

  // UPDATE
  document.getElementById("updateForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const id = document.getElementById("updateId").value;
    const supplier = {
      supplier_name: document.getElementById("updateName").value,
      contact_name: document.getElementById("updateContact").value,
      email: document.getElementById("updateEmail").value,
      phone: document.getElementById("updatePhone").value,
      address: document.getElementById("updateAddress").value
    };

    await fetch(`/api/suppliers/${id}`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(supplier)
    });

    alert("Supplier Updated!");
  });

  // DELETE
  async function deleteSupplier() {
    const id = document.getElementById("deleteId").value;

    await fetch(`/api/suppliers/${id}`, { method: "DELETE" });
    alert("Supplier Deleted!");
  }
</script>
</body>
</html>
